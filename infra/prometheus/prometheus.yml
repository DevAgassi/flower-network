global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Apps run on the host during development (pnpm dev). A target is DOWN while
  # its process is not running, e.g. the worker unless `dev:worker` is started.
  - job_name: api
    static_configs:
      - targets: ['host.docker.internal:3001']

  - job_name: worker
    static_configs:
      - targets: ['host.docker.internal:9464']
